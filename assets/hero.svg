<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">pi-hunk — Review in Hunk. Return with context.</title>
  <desc id="hero-desc">An illustration of pi-hunk for Pi and OMP. Press Ctrl+Space, then h, s, l, b or c to review changes, a commit, history, your branch or the whole codebase in Hunk. Hunk opens beside the agent; a saved comment on a diff line reaches the agent, which answers it.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#111d32"/>
      <stop offset=".55" stop-color="#0b1323"/>
      <stop offset="1" stop-color="#0b1722"/>
    </linearGradient>
    <radialGradient id="mint-glow">
      <stop stop-color="#61dfbc" stop-opacity=".12"/>
      <stop offset="1" stop-color="#61dfbc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blue-glow">
      <stop stop-color="#859afc" stop-opacity=".14"/>
      <stop offset="1" stop-color="#859afc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#152137"/>
      <stop offset="1" stop-color="#0f1828"/>
    </linearGradient>
    <linearGradient id="note" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#20352f"/>
      <stop offset="1" stop-color="#162a29"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#020711" flood-opacity=".35"/>
    </filter>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
      .mono { white-space: pre; font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
      .label { font-size: 17px; font-weight: 700; letter-spacing: 2px; }
    </style>
  </defs>

  <rect width="1600" height="900" rx="28" fill="url(#canvas)"/>
  <ellipse cx="1380" cy="820" rx="620" ry="420" fill="url(#mint-glow)"/>
  <ellipse cx="840" cy="20" rx="740" ry="400" fill="url(#blue-glow)"/>
  <rect x="1" y="1" width="1598" height="898" rx="27" fill="none" stroke="#a4bddb" stroke-opacity=".12"/>

  <!-- Brand -->
  <g transform="translate(80 58)">
    <path d="M2 13 17 26 2 39 M27 39h19" fill="none" stroke="#9bf0cf" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="sans" x="64" y="44" font-size="52" font-weight="700" letter-spacing="-2" fill="#edf4fc">pi-hunk</text>
  </g>
  <g transform="translate(1301 59)">
    <rect width="219" height="54" rx="27" fill="#17243a" stroke="#344661"/>
    <text class="sans" x="109.5" y="36" text-anchor="middle" font-size="25" font-weight="600" fill="#c4cef8">Pi + OMP</text>
  </g>

  <text class="sans" x="80" y="200" font-size="76" font-weight="700" letter-spacing="-2" fill="#f0f5fc">Review in Hunk.</text>
  <text class="sans" x="80" y="282" font-size="76" font-weight="700" letter-spacing="-2" fill="#9bf0cf">Return with context.</text>

  <!-- Prefix, let go, then one view key. -->
  <g transform="translate(82 310)">
    <rect width="176" height="42" rx="9" fill="#1a2940" stroke="#475771"/>
    <text class="mono" x="88" y="28" text-anchor="middle" font-size="21" fill="#e4ebf6">Ctrl+Space</text>
    <text class="sans" x="194" y="28" font-size="21" fill="#7e93b0">then</text>

    <rect x="252" width="42" height="42" rx="9" fill="#203a35" stroke="#548779"/>
    <text class="mono" x="273" y="28" text-anchor="middle" font-size="22" fill="#adf5db">h</text>
    <text class="sans" x="306" y="28" font-size="21" fill="#c2d0e1">changes</text>

    <rect x="410" width="42" height="42" rx="9" fill="#282d47" stroke="#63658a"/>
    <text class="mono" x="431" y="28" text-anchor="middle" font-size="22" fill="#d0c9fa">s</text>
    <text class="sans" x="464" y="28" font-size="21" fill="#c2d0e1">commit</text>

    <rect x="556" width="42" height="42" rx="9" fill="#282d47" stroke="#63658a"/>
    <text class="mono" x="577" y="28" text-anchor="middle" font-size="22" fill="#d0c9fa">l</text>
    <text class="sans" x="610" y="28" font-size="21" fill="#c2d0e1">history</text>

    <rect x="704" width="42" height="42" rx="9" fill="#282d47" stroke="#63658a"/>
    <text class="mono" x="725" y="28" text-anchor="middle" font-size="22" fill="#d0c9fa">b</text>
    <text class="sans" x="758" y="28" font-size="21" fill="#c2d0e1">branch</text>

    <rect x="848" width="42" height="42" rx="9" fill="#282d47" stroke="#63658a"/>
    <text class="mono" x="869" y="28" text-anchor="middle" font-size="22" fill="#d0c9fa">c</text>
    <text class="sans" x="902" y="28" font-size="21" fill="#c2d0e1">codebase</text>
  </g>

  <!-- Illustration of a split window: the agent on the left, Hunk on the right. Not a screenshot. -->
  <g filter="url(#shadow)">
    <rect x="80" y="388" width="1440" height="452" rx="18" fill="url(#window)" stroke="#374761"/>
  </g>
  <path d="M81 430h1438" stroke="#2b3b53"/>
  <circle cx="108" cy="409" r="6.5" fill="#3a4a63"/>
  <circle cx="130" cy="409" r="6.5" fill="#3a4a63"/>
  <circle cx="152" cy="409" r="6.5" fill="#3a4a63"/>
  <text class="mono" x="800" y="415" text-anchor="middle" font-size="17" fill="#7e93b0">acme-api</text>
  <path d="M800 431v408" stroke="#31425b"/>

  <!-- Agent pane -->
  <text class="mono label" x="110" y="467" fill="#b8c8df">AGENT</text>
  <rect x="110" y="484" width="410" height="42" rx="10" fill="#1c2a42" stroke="#2f405b"/>
  <text class="sans" x="128" y="512" font-size="20" fill="#dbe4f2">Add a 30 minute expiry to sessions</text>
  <text class="sans" x="110" y="562" font-size="20" fill="#c6d2e3">Done. Sessions now expire after 30 minutes.</text>

  <rect x="110" y="584" width="656" height="146" rx="14" fill="url(#note)" stroke="#487867"/>
  <g transform="translate(134 606)">
    <path d="M0 3h20v15H9l-6 5v-5H0Z" fill="none" stroke="#9bf0cf" stroke-width="2" stroke-linejoin="round"/>
    <text class="mono label" x="34" y="19" fill="#a5e5cc">HUNK COMMENT #1</text>
  </g>
  <text class="sans" x="742" y="625" text-anchor="end" font-size="17" fill="#77bda9">sent on save</text>
  <text class="mono" x="134" y="666" font-size="18" fill="#8fa3bf">src/session.ts · new line 21</text>
  <text class="sans" x="134" y="704" font-size="21" font-weight="500" fill="#e4f4ec">Use crypto.timingSafeEqual here; === leaks timing.</text>

  <text class="sans" x="110" y="772" font-size="20" fill="#c6d2e3"><tspan fill="#9bf0cf">Good catch.</tspan> Switching verifySession to</text>
  <text class="sans" x="110" y="800" font-size="20" fill="#c6d2e3">timingSafeEqual on the two digests.</text>

  <!-- Hunk pane -->
  <text class="mono label" x="830" y="467" fill="#b8c8df">HUNK <tspan fill="#526984">/</tspan> CHANGES</text>
  <text class="mono" x="1490" y="467" text-anchor="end" font-size="17" fill="#8fa3bf">src/session.ts</text>
  <path d="M801 484h718" stroke="#2b3b53"/>

  <g>
    <rect x="816" y="497" width="688" height="34" rx="4" fill="#8be6c4" fill-opacity=".09"/>
    <rect x="816" y="497" width="3" height="34" rx="1.5" fill="#9bf0cf"/>
    <rect x="816" y="531" width="688" height="34" rx="4" fill="#8be6c4" fill-opacity=".09"/>
    <rect x="816" y="531" width="3" height="34" rx="1.5" fill="#9bf0cf"/>
    <rect x="816" y="565" width="688" height="34" rx="4" fill="#8be6c4" fill-opacity=".09"/>
    <rect x="816" y="565" width="3" height="34" rx="1.5" fill="#9bf0cf"/>
    <rect x="816" y="633" width="688" height="34" rx="4" fill="#8be6c4" fill-opacity=".09"/>
    <rect x="816" y="633" width="3" height="34" rx="1.5" fill="#9bf0cf"/>
    <rect x="816" y="667" width="688" height="34" rx="4" fill="#859afc" fill-opacity=".12"/>
  </g>
  <g font-size="19">
    <text class="mono" x="832" y="520" fill="#617896">15</text><text class="mono" x="868" y="520" fill="#9bf0cf">+</text>
    <text class="mono" x="894" y="520" fill="#b5f0d7"><tspan fill="#c3b9fa">export function</tspan> isExpired(s: Session) {</text>
    <text class="mono" x="832" y="554" fill="#617896">16</text><text class="mono" x="868" y="554" fill="#9bf0cf">+</text>
    <text class="mono" x="894" y="554" fill="#b5f0d7">  <tspan fill="#c3b9fa">return</tspan> Date.now() - s.createdAt &gt; TTL;</text>
    <text class="mono" x="832" y="588" fill="#617896">17</text><text class="mono" x="868" y="588" fill="#9bf0cf">+</text>
    <text class="mono" x="894" y="588" fill="#b5f0d7">}</text>
    <text class="mono" x="832" y="622" fill="#617896">19</text>
    <text class="mono" x="894" y="622" fill="#d6dff0"><tspan fill="#c3b9fa">export function</tspan> verifySession(s, token) {</text>
    <text class="mono" x="832" y="656" fill="#617896">20</text><text class="mono" x="868" y="656" fill="#9bf0cf">+</text>
    <text class="mono" x="894" y="656" fill="#b5f0d7">  <tspan fill="#c3b9fa">if</tspan> (isExpired(s)) <tspan fill="#c3b9fa">return</tspan> false;</text>
    <text class="mono" x="832" y="690" fill="#8fa3bf">21</text>
    <text class="mono" x="894" y="690" fill="#e6edf8">  <tspan fill="#c3b9fa">return</tspan> hash(token) === s.token;</text>
  </g>

  <rect x="894" y="712" width="596" height="76" rx="12" fill="#172a2a" stroke="#77bda9"/>
  <text class="sans" x="914" y="740" font-size="16" font-weight="600" letter-spacing="1" fill="#a5e5cc">YOUR NOTE · R21</text>
  <text class="sans" x="914" y="772" font-size="20" fill="#e4f4ec">Use crypto.timingSafeEqual here; === leaks timing.</text>

  <text class="mono" x="830" y="822" font-size="17" fill="#9bf0cf">pi-hunk live · 1 sent</text>

  <!-- The saved note flows into the agent's conversation. -->
  <path d="M892 750H818q-20 0-20-20v-73q0-20-20-20h-6" fill="none" stroke="#77bda9" stroke-width="2"/>
  <path d="m778 631-7 6 7 6" fill="none" stroke="#9bf0cf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="892" cy="750" r="4.5" fill="#9bf0cf"/>

  <text class="sans" x="800" y="876" text-anchor="middle" font-size="20" fill="#7e93b0">Full-screen in any terminal. Side by side in Tern, Rex and Herdr.</text>
</svg>

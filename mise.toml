[tools]
node = "22.19.0"
npm = "11.17.0"
bun = "1.4.4"

[tasks.setup]
description = "Install dependencies and activate repository Git hooks"
run = ["bun install --frozen-lockfile", "git config core.hooksPath .githooks"]

[tasks.format]
description = "Format source and documentation with Oxfmt"
run = "bun run format"

[tasks."format:check"]
description = "Check formatting without changing files"
run = "bun run format:check"

[tasks.lint]
description = "Lint TypeScript and JavaScript with Oxlint"
run = "bun run lint"

[tasks.typecheck]
description = "Type-check the project"
run = "bun run typecheck"

[tasks.test]
description = "Run the full automated test suite"
run = "bun run test"

[tasks.build]
description = "Build the Pi, OMP, and Hunk extensions"
run = "bun run build"

[tasks.pack]
description = "Verify the exact npm package and a clean consumer install"
run = "bun run verify:package"

[tasks.check]
description = "Run every local release gate"
run = "bun run check"

[tasks."hook:pre-commit"]
description = "Fast checks used by the pre-commit hook"
run = ["bun run format:check", "bun run lint", "bun run typecheck"]

[tasks."hook:pre-push"]
description = "Release gates used by the pre-push hook"
run = "mise run check"

[tasks.changeset]
description = "Describe a user-visible change for the next release"
interactive = true
run = "bunx changeset"

[tasks."changeset:status"]
description = "Show pending Changesets and the resulting version"
run = "bunx changeset status"

[tasks."release:canary:preview"]
description = "Preview the canary package identity"
run = "CANARY_RUN_ID=1 CANARY_RUN_ATTEMPT=1 node scripts/prepare-canary-version.mjs"
[tasks."release:canary"]
description = "Stage a canary of the pushed main, then publish it with npm 2FA"
raw_args = true
run = "node scripts/release-canary.mjs"

[tasks."release:version"]
description = "Consume pending Changesets and update package versions/changelog"
run = ["bunx changeset version", "bunx oxfmt CHANGELOG.md", "bun install --lockfile-only"]
